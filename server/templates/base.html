<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Energy Monitor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('pages.dashboard') }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"></path>
        </svg>
      </span>
      <span class="brand-name">Energy Monitor</span>
    </a>
    <div class="topbar-actions">
      <button type="button" class="btn btn-icon" id="theme-toggle" aria-label="Toggle dark mode"></button>
      <div class="topbar-user" id="topbar-user" style="display:none;">
        <span class="topbar-institution" id="topbar-institution"></span>
        <span class="topbar-user-meta" id="topbar-user-meta"></span>
      </div>
      <button type="button" class="btn btn-outline" id="logout-btn" style="display:none;">Log out</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <nav class="nav">
        {% block sidebar %}
        <div class="nav-group">
          <p class="nav-section">Overview</p>
          <a class="nav-item{% if request.endpoint == 'pages.dashboard' %} active{% endif %}" href="{{ url_for('pages.dashboard') }}">Dashboard</a>
          <a class="nav-item admin-only{% if request.endpoint == 'pages.users' %} active{% endif %}" href="{{ url_for('pages.users') }}">Users</a>
          <a class="nav-item admin-only{% if request.endpoint == 'pages.settings' %} active{% endif %}" href="{{ url_for('pages.settings') }}">Settings</a>
        </div>
        <div class="nav-group">
          <p class="nav-section">Monitoring</p>
          <a class="nav-item{% if request.endpoint == 'pages.buildings' %} active{% endif %}" href="{{ url_for('pages.buildings') }}">Buildings</a>
        </div>
        <div class="nav-group">
          <p class="nav-section">Analysis</p>
          <a class="nav-item{% if request.endpoint == 'pages.compare' %} active{% endif %}" href="{{ url_for('pages.compare') }}">Compare</a>
        </div>
        {% endblock %}
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
